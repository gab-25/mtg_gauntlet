services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg
      POSTGRES_DB: mtg_tester
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The rules engine: Forge behind an HTTP decision protocol
  # (https://github.com/gab-25/mtg_forge_engine), pulled from its GitHub
  # registry image. The card database loads in about a minute before /health
  # answers. No authentication: keep it off the internet.
  forge:
    image: ghcr.io/gab-25/mtg_forge_engine:latest
    environment:
      # Decisions left unanswered this long go to Forge's AI; keep it above a
      # Jev request with its retries.
      DECISION_TIMEOUT: ${DECISION_TIMEOUT:-120}
      # The turn cap: past it the game is a draw.
      MAX_TURNS: ${MAX_TURNS:-50}
      MAX_CONCURRENT_GAMES: ${MAX_CONCURRENT_GAMES:-16}
      # Simulated outcomes (docs/forge.md): attack, block and priority decisions come
      # as whole actions with the position each leads to, which Jev scores.
      SIMULATE: ${SIMULATE:-1}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-8}
      MAX_TARGETS_PER_ABILITY: ${MAX_TARGETS_PER_ABILITY:-4}
      SIMULATION_BUDGET_MS: ${SIMULATION_BUDGET_MS:-1500}
    ports:
      - "127.0.0.1:8080:8080"

  # The Celery broker. No volume: the worker rebuilds the queue from the
  # database when it starts.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      forge:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mtg:mtg@db:5432/mtg_tester
      FORGE_URL: http://forge:8080
      CELERY_BROKER_URL: redis://redis:6379/0
      # Provide your OpenRouter key to enable Jev seats:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    # The worker starts once this answers: migrations are applied by then.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Plays the matches: follows each game and answers its decisions with Jev.
  # Keep ONE replica: its FORGE_WORKERS threads are the global bound on the
  # Jev calls in flight. --concurrency is how many matches it follows at once.
  worker:
    build: .
    command: ["celery", "-A", "mtg_gauntlet", "worker", "--pool", "threads",
              "--concurrency", "${CELERY_CONCURRENCY:-16}", "-l", "info"]
    deploy:
      replicas: 1
    depends_on:
      web:
        condition: service_healthy
      forge:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mtg:mtg@db:5432/mtg_tester
      FORGE_URL: http://forge:8080
      CELERY_BROKER_URL: redis://redis:6379/0
      # Threads answering Forge's decisions: the most Jev calls in flight.
      FORGE_WORKERS: ${FORGE_WORKERS:-4}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MAX_AGENT_CALLS: ${MAX_AGENT_CALLS:-400}
      MAX_MATCH_SECONDS: ${MAX_MATCH_SECONDS:-1800}

volumes:
  pgdata:
