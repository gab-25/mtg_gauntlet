{% comment %}
The sidebar's Matches row: how many of the user's matches Forge is playing. The
page renders it with the count of the moment, then it polls every 10s
(/engine/matches): a session's matches start and end while the page is open.
{% endcomment %}
<div class="engine-row" hx-get="{% url 'matches_status' %}" hx-trigger="every 10s" hx-swap="outerHTML">
    <span class="dot {% if running %}warn{% else %}muted{% endif %}" aria-hidden="true"></span>Matches<span class="engine-value{% if running %} warn{% endif %}">{{ running }} running</span>
</div>
